name: hawkeye_flutter
description: Secure location sharing demo inspired by Life360.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.9
  firebase_storage: ^12.4.8
  google_sign_in: ^6.3.0
  cryptography: ^2.7.0
  convert: ^3.1.2
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
